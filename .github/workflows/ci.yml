name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (typecheck, tests, build)
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : aucune de ces étapes ne se connecte à une vraie
      # base ni ne sert de vrais jetons. `requireJwtSecret`/`requireFrontendOrigin`
      # exigent seulement que les variables existent (voir main.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/archivision?schema=public
      JWT_SECRET: ci-dummy-secret-do-not-use-in-prod
      FRONTEND_ORIGIN: http://localhost:4201
      PORT: 3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Les specs mockent Prisma (pas de vraie DB en CI), mais le client
      # généré doit exister pour que les types compilent.
      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Dépendances de production uniquement, à l'identique de l'image Docker
      # (Dockerfile.api : `npm ci --omit=dev --omit=optional`). --omit=dev
      # seul ne suffit pas : la CLI Prisma (devDependency, jamais utilisée à
      # l'exécution) entraîne plusieurs de ses propres dépendances comme
      # « optional dependency d'une devDependency » (devOptional dans
      # package-lock.json), qu'--omit=dev seul n'exclut pas de l'audit. Voir
      # docs/audit.md pour le détail de cette découverte.
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --omit=optional --audit-level=high

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
