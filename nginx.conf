server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Cache des assets Angular (hachés à la build) ─────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Proxy vers l'API NestJS ───────────────────────────────────────────────
    location /api/ {
        proxy_pass NGINX_API_URL_PLACEHOLDER/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Uploads (logos, avatars) ──────────────────────────────────────────────
    location /uploads/ {
        proxy_pass NGINX_API_URL_PLACEHOLDER/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Angular SPA — toutes les routes inconnues → index.html ───────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
